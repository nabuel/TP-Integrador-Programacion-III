<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="shortcut icon" href="../BackEnd/src/public/favicon/favicon.svg" />

</head>

<body>
    <header class="header-bienvenida">

        <section class="section-logo">

            <div>

                <img src="../BackEnd/src/public/img/logo-2026.png" alt="logo-rapigames" width="200">

            </div>

            <div>

                <h2 class="texto-gradiente">RappiGames</h2>
                <h6 class="texto-gradiente">por Franco L. & Nahuel M.</h4>

            </div>

        </section>


    </header>

    <main>

        <div id="contenedor-form-bienvenida">

            <form id="form-inicio" action="./productos.html">
                <label for="name" class="texto-gradiente" id="label-name">Ingresá tu nombre</label><br>
                <input id="fill-text" type="text"><br><br>
                <input type="submit" class="texto-gradiente" id="submit-continuar" value="Ingresar >>">
            </form>

        </div>

        <div id="contenedor-error"></div>

    </main>

    <footer>

        <p id="empresa-desc" class="texto-gradiente">La compañia de videojuegos y consolas que lidera el mercado.</p>

    </footer>

    <script src="./js/bienvenida.js"></script>

</body>

</html>
