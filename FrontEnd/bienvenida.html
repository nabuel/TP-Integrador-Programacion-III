<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">

    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <!-- <link rel="manifest" href="/favicon/site.webmanifest" /> -->
</head>

<body>
    <header class="header-bienvenida">

        <section class="section-logo">

            <div>

                <img src="img/logo-2026.png" alt="logo-rapigames" width="200">

            </div>

            <div>
                <h2 class="texto-gradiente">RappiGames</h2>
                <h6 class="texto-gradiente">by Franco L. & Nahuel M.</h4>

            </div>

        </section>

        <p id="empresa-desc" class="texto-gradiente">The world's leading gaming and console company.</p>
        
    </header>

    <main>

        <form id="form-inicio" action="./productos.html">
            <label for="name" class="texto-gradiente" id="label-name">Your name</label><br>
            <input id="fill-text" type="text"><br><br>
            <input type="submit" class="texto-gradiente" id="submit-continuar" value="Continue">
        </form>

    </main>

    <script>
        const form = document.getElementById("form-inicio");
        const contenedorNombre = document.getElementById("fill-text")
        form.addEventListener("submit", event =>{
            sessionStorage.setItem("nombreUsuario", contenedorNombre.value)
        })

    </script>

</body>

</html>
