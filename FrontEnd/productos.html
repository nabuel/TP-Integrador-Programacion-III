<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RappiGames</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="shortcut icon" href="../BackEnd/src/public/favicon/favicon.svg" />

</head>

<body>

    <header>

        <section class="section-logo">

            <div>
                <a href="./productos.html">
                    <img id="logo-rappigames" src="../BackEnd/src/public/img/logo-2026.png" alt="logo-rappigames" width="150">
                </a>

            </div>

            <div>
                <h2 class="texto-gradiente">RappiGames</h2>
                <h6 class="texto-gradiente">por Franco L. & Nahuel M.</h4>

            </div>

        </section>

        <nav class="barra-navegacion">

            <div id="contenedor-carrito">

                <img id="musica-img" src="../BackEnd/src/public/img/music.png" alt="musica">

                <a href="./carrito.html">

                    <img id="carrito-img" src="../BackEnd/src/public/img/cart.png" alt="carrito">

                </a>

            </div>

        </nav>

    </header>

    <audio id="musicaFondo" autoplay loop>
        <source src="audio/Silver Surfer.mp3" type="audio/mpeg">
    </audio>

    <main>

        <h2 class="color-titulos sombra-texto centrado font-40" id="mensaje-bienvenida">¡Un placer, </h2>
        <p class="color-titulos sombra-texto centrado font-30">¡Recordá utilizar los <span class="color-titulos-estilo">filtros</span> para tu búsqueda!</p>

        <section id="seccion-filtros" class="font-size-filter">

            <div class="centrado color-titulos" id="contenedor-filtros">

                <div id="category-container" class="flex-column">

                    <label for="categoria" class="color-titulos-estilo"></label>

                    <!-- El select actua como un input, lo podemos agarrar con JS -->

                    <select id="category-filter">

                        <option value="default">Categoria</option>
                        <option value="Consola">Consola</option>
                        <option value="Juego">Juego</option>

                    </select>
                    <button class="boton color-titulos sombra-texto" onclick="applyCategoryFilter()">✓</button>
                </div>

                <div id="sort-container" class="flex-column">

                    <label for="orden" class="color-titulos-estilo"></label>

                    <select id="sort-filter">
                        <option value="default">Ordenamiento</option>
                        <option value="a-z">Nombre ASC</option>
                        <option value="z-a">Nombre DESC</option>
                        <option value="ascendente">Precio ASC</option>
                        <option value="desendente">Precio DESC</option>

                    </select>
                    <button class="boton color-titulos sombra-texto" onclick="applySortFilter()">✓</button>
                </div>

            </div>

        </section>

        <section id="contenedor-productos"></section>

    </main>

    <script src="./js/productos.js"></script>
</body>

</html>
