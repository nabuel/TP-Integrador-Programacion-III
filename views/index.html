<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RappiGames</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link rel="manifest" href="../favicon/site.webmanifest" />
</head>

<body>

    <header>

        <section class="section-logo">

            <div>

                <a href="./index.html">
                    <img id="logo-rappigames" src="img/logo-2026.png" alt="logo-rappigames" width="150">
                </a>

            </div>

            <div>

                <h2 class="texto-gradiente">RappiGames</h2>
                <h6 class="texto-gradiente">by Franco L. & Nahuel M.</h4>

            </div>

        </section>

        <nav>

            <p>
                <a id="parrafo-admin-nav" href="./login.html">Admin</a>
            </p>

            <div id="contenedor-carrito">

                <a href="./carrito.html">
                    <img id="carrito-img" src="./img/cart.png" alt="carrito">
                </a>

            </div>

        </nav>

    </header>

    <main>
        <h2 id="mensaje-bienvenida"></h2>

        <section id="contenedor-productos"></section>

    </main>



    <script>
        //  Cargar mensaje de bienvenida
        const mensajeBienvenida = document.getElementById("mensaje-bienvenida");
        mensajeBienvenida.innerText = `Bienvenid@ ${localStorage.getItem("nombreUsuario")}`;

        const contenedorProductos = document.getElementById("contenedor-productos");
        
        
        const carrito = [];
        const productos = [];
        
        /**
         * Obtengo los productos guardados en la bd
        */
        async function buscarProductos() {
            try {
                // Hago la request a la api para obtener todos los productos.
                const urlBase = "http://localhost:3000"
                const response = await fetch(`${urlBase}/api/productos`);
                const data = await response.json();

                // Valido que la request haya sido exitosa. En caso de que no lo sea se notifica al usuario.
                if (!response.ok) {
                    return mostrarError(data.mensaje);
                }

                data.payload.forEach(e => productos.push(e));
                renderizarProductos(productos);
            } catch (error) {
                console.error(error);
            }
        }

        /**
         * Agrega las cartas de los productos al html.
         * productos -> lista donde se encuentran los productos.
        */
        function renderizarProductos(productos) {
            let productosHTML = "";
            productos.forEach(producto => {
                productosHTML += `<div class="card-producto">
                                    <button class="btn-agregar-prod-carrito"  onclick="agregarCarrito(${producto.id})">
                                        <img src="./img/${producto.imagen}" alt="${producto.nombre}">
                                    </button>
                                    <p class="nombre-prod">${producto.nombre}</p>
                                    <p class="precio-prod">${producto.precio}$</p>
                                </div>`;
            })

            contenedorProductos.innerHTML = productosHTML;

        }

        /**
         * Agrega la alerta de error al html.
        */
        function mostrarError(error) {
            console.log(error);
            contenedorProductos.innerHTML = `<p class="error-alerta">${error}</p>`;
        }

        /**
         *  Agrega el producto al carrito 
         *  id -> id del producto que se quiere agregar
         */
        function agregarCarrito(id) {
            const producto = productos.find(p => p.id == id); 
            carrito.push(producto);
            console.log("Agregando al carrito: ", producto)
            almacenarCarrito();
        }

        function almacenarCarrito(){
            sessionStorage.setItem("productosCarrito", JSON.stringify(carrito))
        }

        buscarProductos();

    </script>
</body>

</html>
