<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RappiGames</title>


    <link rel="stylesheet" href="css/styles.css">
    
    <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>

<body>

    <header>

        <section class="section-logo">

            <div>
                
                <a href="./index.html">
                    <img src="img/logo-2026.png" alt="logo-rapigames" width="200">
                </a>

            </div>

            <div>

                <h2>RappiGames</h2>
                <h6>by Franco L. & Nahuel M.</h4>
                
            </div>

        </section>
        
        <nav>
            <p><a href="./login.html">Panel administrador</a></p>

            <div id="contenedor-carrito">
                <a href="./carrito.html">
                    <img src="./img/cart.png" alt="carrito">
                </a>
            </div>

        </nav>
    </header>

    <main>
        <h2 id="mensaje-bienvenida"></h2>

        <section id="contenedor-productos"></section>

    </main>

    <script>
        //  Cargar mensaje de bienvenida
        const mensajeBienvenida = document.getElementById("mensaje-bienvenida");
        mensajeBienvenida.innerText = `Bienvenid@ ${localStorage.getItem("nombreUsuario")}`;


        //  Traer todos los productos
        const contenedorProductos = document.getElementById("contenedor-productos");

        
        
        async function buscarProductos() {
            try{
                // Hago la request a la api para obtener todos los productos.
                const urlBase = "http://localhost:3000"
                const response = await fetch(`${urlBase}/api/productos`);
                const data = await response.json();

                if(!response.ok){
                    return mostrarError(data.mensaje);
                    console.error(data.mensaje);
                }

                const productos = data.payload;

                renderizarProductos(productos);
            } catch (error) {
                console.error("Error del servidor");
            }
        }


        function renderizarProductos(productos){
            let productosHTML = "";
            console.table(productos);
            productos.forEach(producto => {
                productosHTML += `<div class="card-producto">
                                                <img src="./img/${producto.imagen}" alt="${producto.nombre}">
                                                <p class="nombre-prod">${producto.nombre}</p>
                                                <p class="precio-prod">${producto.precio}$</p>
                                                <button class="btn-agregar-prod-carrito" type="button">Agregar al carrito</button>
                                            </div>`;
            })
            
            contenedorProductos.innerHTML = productosHTML;
        }

        function mostrarError(error){
            console.log(error);
            contenedorProductos.innerHTML = `<p>${error}</p>`;
        }

        buscarProductos();
    </script>
</body>

</html>
